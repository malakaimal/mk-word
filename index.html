<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><link rel="manifest" href="manifest.webmanifest"><title>AK Word</title><style>
:root{--navy:#173b72;--gold:#d9a441;--line:#dce3ee;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:var(--bg);color:#17243a}.top{background:var(--navy);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800}.brand span{color:#f2c66d}.actions button,.toolbar button,.toolbar select{border:1px solid var(--line);background:white;border-radius:6px;padding:8px;cursor:pointer}.actions button{margin-left:6px}.primary{background:var(--gold)!important;font-weight:bold}.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.toolbar{background:white;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:7px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:200px 1fr;gap:16px;margin-top:16px}.side,.work{background:white;border:1px solid var(--line);border-radius:10px;padding:14px}.side button{width:100%;text-align:left;margin:3px 0;padding:9px;border:0;border-radius:6px;background:#f3f6fb;cursor:pointer}.side input,.side select{width:100%;padding:8px;margin:5px 0;border:1px solid var(--line);border-radius:6px}.paper-area{overflow:auto;background:#e8edf5;padding:24px;min-height:680px}.paper{background:white;margin:auto;width:794px;min-height:1123px;padding:76px 72px;box-shadow:0 4px 18px #1b315022;outline:none;line-height:1.55;overflow-wrap:anywhere}.hint,.status{color:#64748b;font-size:12px}@media(max-width:750px){.layout{grid-template-columns:1fr}.paper-area{padding:10px}.paper{width:100%;min-height:850px;padding:36px 24px}.top{flex-wrap:wrap;gap:10px}}
</style></head><body><header class="top"><div class="brand">AK <span>Word</span></div><div class="actions"><button onclick="newDoc()">New</button><button onclick="saveDoc()">Save</button><button class="primary" onclick="printDoc()">Export PDF</button></div></header><main class="wrap"><div class="toolbar">
<select onchange="cmd('fontName',this.value)"><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Calibri</option><option>Courier New</option></select><select onchange="cmd('fontSize',this.value)"><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">32</option></select><button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button><button onclick="cmd('underline')"><u>U</u></button><button onclick="cmd('strikeThrough')"><s>S</s></button><input type="color" title="Text color" onchange="cmd('foreColor',this.value)"><button onclick="cmd('justifyLeft')">Left</button><button onclick="cmd('justifyCenter')">Center</button><button onclick="cmd('justifyRight')">Right</button><button onclick="cmd('insertUnorderedList')">• List</button><button onclick="cmd('insertOrderedList')">1. List</button><button onclick="addTable()">Table</button><button onclick="addLink()">Link</button><button onclick="addImage()">Image</button><button onclick="addSymbol()">Math symbols</button><button onclick="addLatex()">LaTeX</button><button onclick="cmd('undo')">↶</button><button onclick="cmd('redo')">↷</button></div>
<div class="layout"><aside class="side"><h3>Document layout</h3><label>Page size</label><select id="size" onchange="pageSize()"><option>A4</option><option>A3</option><option>A5</option><option>Letter</option><option>Legal</option></select><label>Orientation</label><select id="orient" onchange="pageSize()"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select><label>Margins (mm)</label><input id="margin" type="number" value="20" min="5" max="60" onchange="setMargin()"><hr><h3>My documents</h3><div id="docs"></div><p class="hint">Saved documents stay in this browser.</p><p class="status" id="status">Ready · Offline capable</p></aside><section class="work"><div class="paper-area"><article id="editor" class="paper" contenteditable="true" spellcheck="true"><h1 style="text-align:center">Welcome to AK Word</h1><p>Start writing your document here...</p></article></div><p class="hint">Export PDF opens the print window. Choose Save as PDF.</p></section></div></main>
<script>
const ed=document.getElementById('editor');let timer;function cmd(c,v=null){ed.focus();document.execCommand(c,false,v)}function pageSize(){let s=document.getElementById('size').value,o=document.getElementById('orient').value,d={A4:[794,1123],A3:[1123,1587],A5:[559,794],Letter:[816,1056],Legal:[816,1344]}[s];ed.style.width=(o==='portrait'?d[0]:d[1])+'px';ed.style.minHeight=(o==='portrait'?d[1]:d[0])+'px'}function setMargin(){ed.style.padding=document.getElementById('margin').value*3.78+'px'}function addTable(){let r=+prompt('Rows?','3'),c=+prompt('Columns?','3');if(!r||!c||r>15||c>10)return;cmd('insertHTML','<table border="1" style="border-collapse:collapse;width:100%">'+Array.from({length:r},()=>'<tr>'+Array.from({length:c},()=>'<td>&nbsp;</td>').join('')+'</tr>').join('')+'</table><p></p>')}function addLink(){let u=prompt('Enter link URL');if(u)cmd('createLink',u)}function addImage(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>cmd('insertImage',r.result);r.readAsDataURL(f)};i.click()}function addSymbol(){let s=prompt('Copy a symbol: π α β θ √ ∑ ∫ ≤ ≥ ≠ ± × ÷ ∞','π');if(s)cmd('insertText',s)}function addLatex(){let x=prompt('Simple LaTeX, e.g. \\frac{a}{b}, \\sqrt{x}, \\alpha');if(!x)return;let y=x.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'($1)/($2)').replace(/\\sqrt\{([^{}]+)\}/g,'√($1)').replace(/\\(alpha|beta|theta|pi|infty|sum|int)/g,(_,k)=>({alpha:'α',beta:'β',theta:'θ',pi:'π',infty:'∞',sum:'∑',int:'∫'})[k]);cmd('insertText',y)}function newDoc(){if(confirm('Start a new document?'))ed.innerHTML='<p><br></p>'}function saveDoc(){let n=prompt('Document name','My document');if(!n)return;let a=JSON.parse(localStorage.akdocs||'{}');a[n]=ed.innerHTML;localStorage.akdocs=JSON.stringify(a);document.getElementById('status').textContent='Saved: '+n;renderDocs()}function renderDocs(){let a=JSON.parse(localStorage.akdocs||'{}');document.getElementById('docs').innerHTML=Object.keys(a).map(n=>'<button onclick="loadDoc('+JSON.stringify(n)+')">'+n+'</button>').join('')||'<small>No saved documents</small>'}function loadDoc(n){ed.innerHTML=JSON.parse(localStorage.akdocs||'{}')[n]||''}function printDoc(){let w=window.open('','_blank');w.document.write('<html><head><title>AK Word PDF</title><style>body{font:12pt Arial;line-height:1.5;margin:20mm}table{border-collapse:collapse}td{padding:6px}</style></head><body>'+ed.innerHTML+'</body></html>');w.document.close();w.print()}ed.addEventListener('input',()=>{document.getElementById('status').textContent='Editing…';clearTimeout(timer);timer=setTimeout(()=>{localStorage.akdraft=ed.innerHTML;document.getElementById('status').textContent='Draft autosaved locally'},700)});renderDocs();if(localStorage.akdraft)ed.innerHTML=localStorage.akdraft;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
